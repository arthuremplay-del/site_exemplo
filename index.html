<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Gamer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scanlines"></div>
    <div id="game-container"></div>
    
    <div class="container">
        <div class="gamepad-wrapper">
            <svg class="gamepad-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="4" ry="4"></rect>
                <path d="M6 12h4"></path>
                <path d="M8 10v4"></path>
                <line x1="15" y1="13" x2="15.01" y2="13"></line>
                <line x1="18" y1="11" x2="18.01" y2="11"></line>
            </svg>
        </div>
        <h1 class="glitch" data-text="Arthur Gamer">Arthur Gamer</h1>
        <p class="subtitle">Welcome to the Next Level</p>
        
        <div class="stats">
            <div class="stat-box">
                <span class="label">SCORE</span>
                <span class="value" id="score-display">0</span>
            </div>
            <div class="stat-box">
                <span class="label">RANK</span>
                <span class="value">GLOBAL ELITE</span>
            </div>
            <div class="stat-box">
                <span class="label">K/D RATIO</span>
                <span class="value">9.99</span>
            </div>
        </div>
    </div>

    <div class="particles" id="particles"></div>
    <div id="custom-cursor"></div>
    
    <script src="script.js"></script>
</body>
</html>
